name: Benchmark Scoring

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 02:00 UTC (after NOAA data is available)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/forecasts/**'

permissions:
  contents: write

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Score forecasts
        run: python benchmark.py

      - name: Commit results
        run: |
          git config user.name "Benchmark Bot"
          git config user.email "bot@flarient.com"
          git add data/results/
          git diff --cached --quiet || git commit -m "Benchmark scores update [skip ci]"
          git push || echo "Nothing to push"

      # Step summary is now written by benchmark.py directly via GITHUB_STEP_SUMMARY
      # (avoids fragile shell quoting in a python -c one-liner)
